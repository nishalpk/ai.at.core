<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent observatory</title><style>*{box-sizing:border-box}body{margin:0;background:#090e18;color:#dce4f4;font:13px ui-monospace,Consolas,monospace;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font:26px system-ui;margin:0 0 6px}small{color:#77859e}.live{color:#68e2b7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.terminal{border:1px solid #283247;border-radius:12px;overflow:hidden;background:#101725}.bar{display:flex;gap:7px;align-items:center;background:#1a2435;padding:15px}.dot{height:9px;width:9px;background:#ff6c81;border-radius:50%}.dot:nth-child(2){background:#e5bd62}.dot:nth-child(3){background:#68d8ac}.bar b{margin-left:12px;flex:1}.scroll{height:75vh;overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th{position:sticky;top:0;background:#141e2e;color:#7e91b3;text-align:left;padding:12px 8px;font-weight:normal;text-transform:uppercase;font-size:10px}td{padding:12px 8px;border-top:1px solid #1c273a;vertical-align:top;overflow-wrap:anywhere}th:nth-child(1){width:15%}th:nth-child(2){width:28%}th:nth-child(3){width:25%}th:nth-child(4){width:32%}td:first-child{color:#7588a7;font-size:11px}td:nth-child(2){color:#bb9af7}td:nth-child(3){color:#78dcce}details summary{cursor:pointer;color:#dce4f4}pre{white-space:pre-wrap;font-size:11px;color:#90a3c3}tr:hover{background:#182238}.badge{color:#68e2b7}button{background:#1a2435;color:#dce4f4;border:1px solid #35425b;border-radius:8px;padding:9px;cursor:pointer}@media(max-width:950px){.grid{grid-template-columns:1fr}body{padding:14px}.scroll{height:50vh}}</style></head><body><header><div><h1>Agent observatory<span class="live"> ●</span></h1><small>Two processes. One trace. · secrets excluded</small></div><a href="http://localhost:8003" target="_blank" style="color:#85e3cc">Booking desk ↗</a><button id="refresh">↻ Refresh</button><button id="clear">Clear view</button><button id="pause">Pause stream</button></header><div class="grid"><section class="terminal"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><b>A / travel assistant</b><span class="badge">:8000</span></div><div class="scroll"><table><thead><tr><th>Time</th><th>Model</th><th>Operation</th><th>Event</th></tr></thead><tbody id="A"></tbody></table></div></section><section class="terminal"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><b>B / airline agent</b><span class="badge">:8001</span></div><div class="scroll"><table><thead><tr><th>Time</th><th>Model</th><th>Operation</th><th>Event</th></tr></thead><tbody id="B"></tbody></table></div></section></div><p id="state"></p><script>let paused=false,last='',since=0;document.querySelector('#refresh').onclick=()=>{last='';refresh()};document.querySelector('#clear').onclick=()=>{since=Date.now()/1000;last='';for(const id of ['A','B'])document.getElementById(id).replaceChildren();refresh()};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume stream':'Pause stream'};async function refresh(){if(paused)return;try{const r=await fetch('/api/logs');const es=await r.json(),key=JSON.stringify(es);if(key!==last){last=key;for(const owner of ['A','B']){const body=document.getElementById(owner);body.replaceChildren();for(const e of es.filter(e=>e.owner===owner&&e.time>since).reverse()){const row=document.createElement('tr');for(const text of [new Date(e.time*1000).toLocaleTimeString(),e.model||(owner==='B'?'deterministic':'—'),e.operation||e.label||e.role||'—']){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}const cell=document.createElement('td'),details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent=e.event;pre.textContent=JSON.stringify(e,null,2);details.append(summary,pre);cell.append(details);row.append(cell);body.append(row)}}}document.querySelector('#state').textContent='● Updated '+new Date().toLocaleTimeString()+' · polling every 2s'}catch{document.querySelector('#state').textContent='Connection lost. Retrying…'}}refresh();setInterval(refresh,2000)</script></body></html>
