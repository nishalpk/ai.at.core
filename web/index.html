<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voyage · Travel assistant</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0edf6;color:#23263d;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.shell{width:min(760px,100%);height:94vh;max-height:1050px;background:#fff;border:1px solid #e5e0ef;border-radius:28px;box-shadow:0 20px 80px #31285112;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:14px;padding:22px 28px;border-bottom:1px solid #f0edf5}.logo{background:#9b55d4;color:white;border-radius:15px;padding:12px;font-size:22px}h1{font-size:20px;margin:0}header small{color:#9091a2}header a{margin-left:auto;color:#8a49bd;text-decoration:none}.intro{text-align:center;padding:24px;color:#9291a4;font-size:12px;letter-spacing:1px}#view{overflow-y:auto;flex:1;padding:0 28px 24px;display:flex;flex-direction:column;gap:18px}.row{display:flex;gap:9px;align-items:flex-end;max-width:88%}.row.user{align-self:flex-end;flex-direction:row-reverse}.avatar{background:#eddbff;color:#9352c3;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px}.user .avatar{background:#262840;color:white}.bubble{white-space:pre-wrap;line-height:1.6;background:#eedcff;border-radius:18px 18px 18px 3px;padding:14px 18px}.user .bubble{background:#282b46;color:white;border-radius:18px 18px 3px 18px}#actions{padding:0 28px;display:flex;gap:8px;flex-wrap:wrap}button,.action{border:0;background:#a05ad1;color:#fff;border-radius:16px;padding:12px 18px;cursor:pointer;text-decoration:none;font:inherit}button:hover,.action:hover{background:#8742b8}button:disabled{opacity:.5;cursor:wait}footer{padding:18px 24px}form{display:flex;border:1px solid #e1d7ee;border-radius:28px;padding:6px;gap:8px}input{flex:1;min-width:0;border:0;outline:0;padding:10px 14px;font:inherit;background:none}form button{border-radius:50%;width:44px;padding:0;font-size:23px}.hint{text-align:center;color:#9994a7;font-size:11px;margin:12px 0 0}#notice{min-height:20px;color:#a05ad1;font-size:12px;padding:8px 28px}@media(max-width:600px){.shell{height:100dvh;border-radius:0;border:0}.row{max-width:94%}#view{padding:0 16px 20px}header{padding:18px}}</style></head><body><section class="shell"><header><div class="logo">✈</div><div><h1>voyage</h1><small>Your travel companion</small></div><button id="reset" type="button" style="margin-left:auto">↻ New chat</button><a href="http://localhost:8002" target="_blank">Agent activity ↗</a></header><div class="intro">A LITTLE CONVERSATION. YOUR NEXT DESTINATION.</div><main id="view" aria-live="polite"></main><div id="actions"></div><div id="notice" role="status"></div><footer><form id="chat"><input id="message" required placeholder="Where are we going?" autocomplete="off"><button aria-label="Send message">↑</button></form><p class="hint">Airline permissions and purchase confirmation always stay in your hands.</p></footer></section><script>
const view=document.querySelector('#view'),actions=document.querySelector('#actions'),notice=document.querySelector('#notice');let history=[];
function bubble(role,text){const row=document.createElement('div');row.className='row '+role;const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=role==='user'?'U':'V';const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(avatar,b);view.append(row)}
async function render(r){const d=await r.json();if(!r.ok){notice.textContent=d.detail||'The request failed. Please try again.';return}history=d.history||[];view.replaceChildren();for(const m of history)bubble(m.role==='user'?'user':'assistant',m.content);if(!history.length)bubble('assistant',"Hello! I can search flights or help you book. Where would you like to go?");actions.replaceChildren();if(d.type==='consent'){const a=document.createElement('a');a.className='action';a.href=d.url;a.textContent='Authorize with airline';actions.append(a)}if(d.type==='select'){for(const f of d.flights){const b=document.createElement('button');b.textContent=f.id+' · '+f.depart+' · $'+f.price_usd;b.onclick=()=>send('/api/select',{flight_id:f.id});actions.append(b)}}if(d.type==='confirm'){for(const approve of [true,false]){const b=document.createElement('button');b.textContent=approve?'Approve purchase':'Decline';b.onclick=()=>send('/api/confirm',{approve});actions.append(b)}}view.scrollTop=view.scrollHeight}
async function send(url,data){notice.textContent='Voyage is thinking…';document.querySelector('#chat button').disabled=true;if(data.message){document.querySelector('#message').value='';bubble('user',data.message);view.scrollTop=view.scrollHeight}try{await render(await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}));notice.textContent=''}catch{notice.textContent='Unable to reach the service. Please try again.'}finally{document.querySelector('#chat button').disabled=false}}
document.querySelector('#reset').onclick=()=>send('/api/reset',{});document.querySelector('#chat').onsubmit=e=>{e.preventDefault();if(document.querySelector('#chat button').disabled)return;send('/api/chat',{message:document.querySelector('#message').value})};fetch('/api/status').then(render).catch(()=>notice.textContent='Unable to connect.');
</script></body></html>
