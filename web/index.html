<!doctype html><html><head><meta charset="utf-8"><title>Two Agents · Flight desk</title><style>body{font:17px system-ui;background:#101b2d;color:#eef4ff;max-width:840px;margin:60px auto;padding:20px}h1{font-size:42px}input{width:75%;padding:15px}button,a{padding:12px;background:#75e2ce;color:#102235;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:#1c2c44;padding:24px;border-radius:12px}.muted{color:#acbdd3}</style></head><body><p class="muted">TRAVEL ASSISTANT → AIRLINE AGENT</p><h1>Your next flight.</h1><p>Try: “Book me from BOM to Dubai tomorrow at 7pm”.</p><form id="chat"><input id="message" required placeholder="Where would you like to fly?"><button>Send</button></form><p id="notice"></p><pre id="view">Connecting…</pre><div id="actions"></div><p class="muted">Airline login and permissions are handled by Keycloak. Flight times are local to the departure airport.</p><script>
const view=document.querySelector('#view'),actions=document.querySelector('#actions');
async function render(r){const d=await r.json();view.textContent=d.type==='consent'?'The airline needs your permission: '+d.scopes.join(', '):d.type==='confirm'?d.flight.id+' · '+d.flight.origin+' → '+d.flight.destination+'\n'+d.flight.date+' at '+d.flight.depart+' · USD '+d.flight.price_usd:d.type==='result'?'Booking '+d.data.status+'\nReference: '+d.data.booking_id:d.message||d.detail||'Ready. Tell me your route, date and departure time.';actions.replaceChildren();if(d.type==='consent'){const a=document.createElement('a');a.href=d.url;a.textContent='Authorize with airline';actions.append(a)}if(d.type==='confirm'){for(const approve of [true,false]){const b=document.createElement('button');b.textContent=approve?'Confirm booking':'Decline';b.onclick=()=>send('/api/confirm',{approve});actions.append(b)}}}
async function send(url,data){document.querySelector('#notice').textContent='Working…';try{await render(await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}))}catch(e){view.textContent='Unable to reach the service.'}finally{document.querySelector('#notice').textContent=''}}
document.querySelector('#chat').onsubmit=e=>{e.preventDefault();send('/api/chat',{message:document.querySelector('#message').value})};fetch('/api/status').then(render);
</script></body></html>
